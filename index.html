<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slow Page Diary</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Playfair Display', serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    a {
      display: block;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 15px;
      border-radius: 30px;
      margin: 12px auto;
      width: 100%;
      transition: 0.3s ease;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>slow page diary</h1>
    <p>quiet reading spaces • soft thoughts • slow stories</p>

    <a href="https://app.thestorygraph.com/profile/slowpagediary" target="_blank">📖 StoryGraph</a>
    <a href="https://gyanubasnet-1.github.io/slow-page-diary/book_review_blog.html" target="_blank">📝 Book Review Blog</a>
    <a href="https://www.barnesandnoble.com/account/wishlist/" target="_blank">🛍 Barnes & Noble Wishlist</a>
  </div>
</body>
</html>
